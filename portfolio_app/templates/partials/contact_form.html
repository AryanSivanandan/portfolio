<div class="space-y-6 animate-fade-in">

  <!-- FORM HEADER -->
  <div>
    <h3 class="text-lg font-medium text-white mt-1">
      Send a message
    </h3>
    <div class="w-10 h-px bg-gray-700 mt-3"></div>
  </div>

  <!-- FORM -->
  <form method="post" class="space-y-5">
    {% csrf_token %}

    <div>
      <label class="block text-sm mb-2">Name</label>
      {{ form.name }}
    </div>

    <div>
      <label class="block text-sm mb-2">Email</label>
      {{ form.email }}
    </div>

    <div>
      <label class="block text-sm mb-2">Message</label>
      {{ form.message }}
    </div>

    <button
      type="submit"
      class="mt-4 px-6 py-2 bg-white text-black rounded hover:bg-gray-200 transition"
    >
      Send
    </button>
  </form>

</div>
