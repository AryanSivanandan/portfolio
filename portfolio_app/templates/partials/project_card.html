<div class="group bg-black/40 border border-gray-800
            rounded-xl p-6
            transition-all duration-300
            hover:border-gray-600
            hover:-translate-y-1
            hover:shadow-xl hover:shadow-black/40">
  <h3 class="text-xl font-semibold mb-2">
    {{ project.title }}
  </h3>

  <p class="text-gray-400 text-sm mb-3">
    {{ project.description }}
  </p>

  <p class="text-xs text-gray-500 mb-4">
    {{ project.tech_stack }}
  </p>

  <div class="flex gap-4 text-sm">
    {% if project.github_url %}
      <a href="{{ project.github_url }}" class="text-blue-400 hover:underline">
        GitHub
      </a>
    {% endif %}
    {% if project.live_url %}
      <a href="{{ project.live_url }}" class="text-green-400 hover:underline">
        Live
      </a>
    {% endif %}
  </div>
</div>
