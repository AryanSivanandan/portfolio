{% load static %}

<h2 class="text-3xl font-semibold mb-10">Projects</h2>

<div class="grid md:grid-cols-2 gap-8">
  {% for project in projects %}
    <div class="rounded-xl bg-gray-900/60 border border-gray-800 p-6 hover:border-gray-600 transition">
      <h3 class="text-xl font-semibold mb-2">
        {{ project.title }}
      </h3>

      <p class="text-gray-400 text-sm mb-4">
        {{ project.description }}
      </p>

      {% if project.tech_stack %}
        <p class="text-xs text-gray-500">
          {{ project.tech_stack }}
        </p>
      {% endif %}
    </div>
  {% empty %}
    <p class="text-gray-400">No projects added yet.</p>
  {% endfor %}
</div>
