<!DOCTYPE html>
<html class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <title>Aryan Sivanandan</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>

<style>
@keyframes fade-in {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.animate-on-scroll {
  opacity: 0;
  transform: translateY(20px);
}

.animate-fade-in {
  animation: fade-in 0.9s ease-out both;
}

/* delays */
.delay-100 { animation-delay: 0.1s; }
.delay-200 { animation-delay: 0.2s; }
.delay-300 { animation-delay: 0.3s; }
.delay-400 { animation-delay: 0.4s; }
.delay-500 { animation-delay: 0.5s; }
.delay-600 { animation-delay: 0.6s; }
.delay-700 { animation-delay: 0.7s; }
</style>
</head>

<body class="bg-gradient-to-br from-gray-950 via-gray-900 to-black text-gray-100">

    <aside class="fixed left-0 top-0 h-screen w-16 bg-black/40 backdrop-blur border-r border-white/5 flex flex-col items-center py-6 space-y-6 z-50">
    <a href="#home" class="text-lg font-bold">A</a>

    <nav class="flex flex-col gap-6 text-gray-400">
      <a href="#home" class="hover:text-white transition">🏠</a>
      <a href="#about" class="hover:text-white transition">👤</a>
      <a href="#projects" class="hover:text-white transition">🧠</a>
      <a href="#experience" class="hover:text-white transition">💼</a>
      <a href="#contact" class="hover:text-white transition">✉️</a>
    </nav>

    <div class="mt-auto text-gray-500">🌙</div>
  </aside>

  <main class = "ml-16">{% block content %}{% endblock %}</main>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const observer = new IntersectionObserver(
    entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('animate-fade-in');
          observer.unobserve(entry.target); // animate once
        }
      });
    },
    { threshold: 0.15 }
  );

  document.querySelectorAll('.animate-on-scroll').forEach(el => {
    observer.observe(el);
  });
});
</script>



</body>
</html>
